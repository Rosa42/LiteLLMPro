# 套餐（Quota Group）声明式配置示例。
# 复制为 config/plans.yaml 后用 scripts/llm-router.ps1 apply 生成 litellm.yaml。
# 密钥只写在 .env，这里只写环境变量名。

# 同一套餐 = 同一 API Key / 同一额度池 = 同一个 quota_group_id
# priority 数字越小越优先填满（Fill First）
# models 必须是该套餐实际上游支持的模型 ID

plans:
  # 示例：火山 Coding Plan 账号 C
  - id: volc-c
    display_name: Volc Coding Plan C
    provider_id: volcengine
    priority: 10
    base_url_env: VOLC_CODING_BASE_URL
    api_key_env: VOLC_CODING_KEY_C
    # Coding Plan OpenAI 兼容地址示例：
    # https://ark.cn-beijing.volces.com/api/coding/v3
    models:
      - ark-code-latest
      - glm-5.2
      - glm-latest
      - doubao-seed-2.0-code
      - doubao-seed-2.0-pro
      - doubao-seed-2.0-lite
      # 仅当套餐文档确认支持时再打开：
      # - kimi-k3
      # - doubao-seed-code

  # 示例：第二把火山 Key（额度独立，可做 Fill First 切换）
  # - id: volc-d
  #   display_name: Volc Coding Plan D
  #   provider_id: volcengine
  #   priority: 20
  #   base_url_env: VOLC_CODING_BASE_URL_D
  #   api_key_env: VOLC_CODING_KEY_D
