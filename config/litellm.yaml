    allow_conversion: false
  deepseek-v4-flash:
    public_protocols: [anthropic_messages, openai_chat]
    allow_conversion: true
    conversion_policy:
      allowed:
        - from: anthropic_messages
          to: openai_chat
  glm-5.2:
    public_protocols: [anthropic_messages]
    allow_conversion: false
  kimi-k3:
