[project]
name = "shared-quota-router"
version = "0.1.0"
description = "Shared Coding Plan quota routing extension for LiteLLM Proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "fakeredis[lua]>=2.23.0",
]
contract = [
    # C0/C1: pin to match LITELLM_VERSION (config/versions.env)
    "litellm==1.90.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/shared_quota_router"]

[tool.hatch.build.targets.wheel.sources]
"plugins" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shared_quota_router"]
mypy_path = "plugins"
